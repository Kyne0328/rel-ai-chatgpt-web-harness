name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: test (node 26)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - name: Use declared npm
        run: node scripts/ensure-package-manager.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: electron
      - name: Install Electron test binary
        run: node electron/node_modules/electron/install.js
      - name: Verify Electron test binary
        run: test -x electron/node_modules/electron/dist/electron
      - name: Run shared source gate
        run: xvfb-run --auto-servernum npm run test:all
      - name: Enforce MCP startup performance budget
        run: npm run benchmark:mcp-startup
      - name: Enforce Repository Intelligence performance budget
        run: node scripts/repository-intelligence-benchmark.mjs --files 5000 --mutations 50 --json --max-full-ms 30000 --max-incremental-ms 5000
      - name: Test frontend browser experience
        run: xvfb-run --auto-servernum npm run test:frontend
      - name: Enforce dashboard observability performance budget
        run: xvfb-run --auto-servernum npm run benchmark:observability:strict
      - name: Enforce computer-control processing budget
        run: npm run benchmark:computer:strict
      - name: Test local browser capabilities
        run: xvfb-run --auto-servernum npm run test:web-automation

  packaged-windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 35
    name: packaged Windows application
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - name: Use declared npm
        run: node scripts/ensure-package-manager.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: electron
      - name: Run Windows platform regression tests
        shell: pwsh
        run: |
          node test/electron-platform-unit.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/current-unpacked-unit.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/app-updater-unit.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/process-cancellation-unit.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/process-output-pipe-stall-unit.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/installer-test-entrypoints-unit.mjs
      - name: Smoke-test native Windows dashboard chrome
        run: npm run test:custom-chrome-browser
      - name: Build unpacked Windows application
        run: npm run electron:build:windows
      - name: Resolve current unpacked application
        id: unpacked
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDirectory = [string](node scripts/current-unpacked.mjs --platform win32 --allow-build-check)
          $packageDirectory = $packageDirectory.Trim()
          if (-not $packageDirectory -or -not (Test-Path -LiteralPath $packageDirectory -PathType Container)) { throw 'Could not resolve unpacked Windows application.' }
          "path=$packageDirectory" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Verify packaged application layout
        shell: pwsh
        run: npm run verify:packaged -- --platform win32 --dir '${{ steps.unpacked.outputs.path }}'
      - name: Verify packaged computer runtime
        shell: pwsh
        run: node scripts/verify-packaged-computer-runtime.mjs --platform win32 --dir '${{ steps.unpacked.outputs.path }}'
      - name: Verify hardened Electron fuses
        shell: pwsh
        run: npm run verify:fuses -- --platform win32
      - name: Verify packaged MCP connector flow
        shell: pwsh
        run: npm run test:connector-acceptance -- --dir '${{ steps.unpacked.outputs.path }}'

  packaged-linux:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    name: packaged Linux application
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - name: Use declared npm
        run: node scripts/ensure-package-manager.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: electron
      - name: Install Electron test binary
        run: node electron/node_modules/electron/install.js
      - name: Install Linux desktop runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends x11-xserver-utils
      - name: Build Linux release artifacts
        run: npm run electron:dist:linux
      - name: Resolve current unpacked application
        id: unpacked
        shell: bash
        run: |
          set -euo pipefail
          package_directory="$(node scripts/current-unpacked.mjs --platform linux --allow-build-check)"
          test -n "$package_directory" && test -d "$package_directory"
          echo "path=$package_directory" >> "$GITHUB_OUTPUT"
      - name: Verify packaged application layout
        run: npm run verify:packaged -- --platform linux --dir '${{ steps.unpacked.outputs.path }}'
      - name: Check Linux package size
        run: npm run electron:size:linux
      - name: Verify packaged computer runtime
        run: xvfb-run --auto-servernum node scripts/verify-packaged-computer-runtime.mjs --platform linux --dir '${{ steps.unpacked.outputs.path }}'
      - name: Verify hardened Electron fuses
        run: npm run verify:fuses -- --platform linux
      - name: Verify packaged MCP connector flow
        run: npm run test:connector-acceptance -- --dir '${{ steps.unpacked.outputs.path }}'
      - name: Smoke-test Linux desktop startup and shutdown under Xvfb
        shell: bash
        run: bash scripts/smoke-linux-desktop.sh '${{ steps.unpacked.outputs.path }}' "$RUNNER_TEMP/relai-linux-smoke"
