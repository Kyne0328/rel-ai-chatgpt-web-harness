name: Publish GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - CHANGELOG.md
      - electron/**
      - scripts/**
      - vendor/zoekt/**
      - vendor/tunnel-client/**
      - src/repository/intelligence/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-github-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve unpublished version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.preflight.outputs.publish }}
      recover_draft: ${{ steps.preflight.outputs.recover_draft }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Resolve publication state
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          api_base="${GITHUB_API_URL:-https://api.github.com}"
          release_url="$api_base/repos/$GITHUB_REPOSITORY/releases/tags/$VERSION"
          http_status="$(curl --silent --show-error --output release-response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$release_url")"
          recover_draft=false
          case "$http_status" in
            200)
              release_tag="$(node -p "require('./release-response.json').tag_name || ''")"
              release_target="$(node -p "require('./release-response.json').target_commitish || ''")"
              release_draft="$(node -p "require('./release-response.json').draft === true ? 'true' : 'false'")"
              if [ "$release_tag" != "$VERSION" ]; then
                echo "GitHub release lookup returned tag $release_tag instead of $VERSION." >&2
                exit 1
              fi
              if [ "$release_target" != "$GITHUB_SHA" ]; then
                echo "Existing release $VERSION targets $release_target, not current release commit $GITHUB_SHA." >&2
                exit 1
              fi
              if [ "$release_draft" = 'true' ]; then
                recover_draft=true
                echo "Recovering interrupted draft release $VERSION."
              else
                if ! git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
                  echo "Published GitHub release $VERSION has no matching Git tag." >&2
                  exit 1
                fi
                git fetch --force origin "refs/tags/$VERSION:refs/tags/$VERSION"
                tag_commit="$(git rev-list -n 1 "refs/tags/$VERSION")"
                if [ "$tag_commit" != "$GITHUB_SHA" ]; then
                  echo "Existing tag $VERSION points to $tag_commit, not current release commit $GITHUB_SHA." >&2
                  exit 1
                fi
                echo "recover_draft=false" >> "$GITHUB_OUTPUT"
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "GitHub release $VERSION is already published from current release commit $GITHUB_SHA. Nothing will be republished."
                exit 0
              fi
              ;;
            404)
              ;;
            *)
              cat release-response.json >&2 || true
              echo "Could not determine whether GitHub release $VERSION exists. GitHub API returned HTTP $http_status." >&2
              exit 1
              ;;
          esac

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$VERSION:refs/tags/$VERSION"
            tag_commit="$(git rev-list -n 1 "refs/tags/$VERSION")"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "Existing tag $VERSION points to $tag_commit, not current release commit $GITHUB_SHA." >&2
              exit 1
            fi
            echo "Recovering unpublished release from existing tag $VERSION at $tag_commit."
          fi
          echo "recover_draft=$recover_draft" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Use declared npm
        if: steps.preflight.outputs.publish == 'true'
        run: node scripts/ensure-package-manager.mjs
      - name: Install release validation dependencies
        if: steps.preflight.outputs.publish == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify release consistency
        if: steps.preflight.outputs.publish == 'true'
        run: npm run release:check

  release-gate:
    name: Validate release source
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - name: Use declared npm
        run: node scripts/ensure-package-manager.mjs
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Electron dependencies
        run: npm ci --no-audit --no-fund
        working-directory: electron
      - name: Install Electron test binary
        run: node electron/node_modules/electron/install.js
      - name: Verify Electron test binary
        run: test -x electron/node_modules/electron/dist/electron
      - name: Run release source gate
        run: xvfb-run --auto-servernum npm run test:release
      - name: Enforce release performance budgets
        shell: bash
        run: |
          set -euo pipefail
          npm run benchmark:mcp-startup
          node scripts/repository-intelligence-benchmark.mjs --files 5000 --mutations 50 --json --max-full-ms 30000 --max-incremental-ms 5000
          xvfb-run --auto-servernum npm run benchmark:observability:strict
      - name: Verify complete frontend browser behavior
        run: xvfb-run --auto-servernum npm run test:frontend

  windows:
    name: Build Windows release
    needs:
      - preflight
      - release-gate
    if: needs.preflight.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - name: Use declared npm
        run: node scripts/ensure-package-manager.mjs
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Electron dependencies
        run: npm ci --no-audit --no-fund
        working-directory: electron
      - name: Run Windows platform regression tests
        shell: pwsh
        run: |
          node test/electron-platform-unit.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/current-unpacked-unit.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/app-updater-unit.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/installer-test-entrypoints-unit.mjs
      - name: Build Windows release
        run: npm run electron:dist:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Resolve current unpacked application
        id: unpacked
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDirectory = [string](node scripts/current-unpacked.mjs --platform win32)
          $packageDirectory = $packageDirectory.Trim()
          if (-not $packageDirectory -or -not (Test-Path -LiteralPath $packageDirectory -PathType Container)) {
            throw 'Resolved current Windows unpacked application path is missing or invalid.'
          }
          "path=$packageDirectory" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Verify hardened Electron fuses
        shell: pwsh
        run: npm run verify:fuses -- --platform win32
      - name: Verify packaged application layout
        shell: pwsh
        run: npm run verify:packaged -- --platform win32 --dir '${{ steps.unpacked.outputs.path }}'
      - name: Verify packaged computer runtime
        shell: pwsh
        run: node scripts/verify-packaged-computer-runtime.mjs --platform win32 --dir '${{ steps.unpacked.outputs.path }}'
      - name: Verify packaged bearer-authenticated MCP flow
        shell: pwsh
        run: npm run test:connector-acceptance -- --dir '${{ steps.unpacked.outputs.path }}'
      - name: Generate CycloneDX SBOM
        run: npm run generate:sbom
      - name: Check Electron package size
        run: npm run electron:size:windows
      - name: Resolve Windows release artifact paths
        id: release-artifacts
        run: node scripts/release-artifacts.mjs --platform win32 --github-output paths
      - name: Upload Windows release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-${{ needs.preflight.outputs.version }}
          path: ${{ steps.release-artifacts.outputs.paths }}
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux release
    needs:
      - preflight
      - release-gate
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - name: Use declared npm
        run: node scripts/ensure-package-manager.mjs
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Electron dependencies
        run: npm ci --no-audit --no-fund
        working-directory: electron
      - name: Install Electron test binary
        run: node electron/node_modules/electron/install.js
      - name: Verify Electron test binary
        run: test -x electron/node_modules/electron/dist/electron
      - name: Install Linux desktop runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends x11-xserver-utils
      - name: Run Electron platform regression tests
        run: |
          node test/electron-platform-unit.mjs
          node test/current-unpacked-unit.mjs
          node test/app-updater-unit.mjs
          node test/installer-test-entrypoints-unit.mjs
      - name: Build Linux release
        run: npm run electron:dist:linux
      - name: Resolve Linux release artifact paths
        id: release-artifacts
        shell: bash
        run: |
          node scripts/release-artifacts.mjs --platform linux --github-output paths
          node scripts/release-artifacts.mjs --artifact linuxDeb --github-output deb
      - name: Verify Linux DEB upgrade metadata
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.preflight.outputs.version }}'
          deb='${{ steps.release-artifacts.outputs.deb }}'
          package_name="$(node -p "require('./electron/package.json').build.deb.packageName")"
          test -f "$deb"
          test "$(dpkg-deb --field "$deb" Package)" = "$package_name"
          test "$(dpkg-deb --field "$deb" Version)" = "$version"
          test "$(dpkg-deb --field "$deb" Architecture)" = 'amd64'
          dpkg --compare-versions "$(dpkg-deb --field "$deb" Version)" eq "$version"
      - name: Resolve current unpacked application
        id: unpacked
        shell: bash
        run: |
          set -euo pipefail
          package_directory="$(node scripts/current-unpacked.mjs --platform linux)"
          test -n "$package_directory"
          test -d "$package_directory"
          echo "path=$package_directory" >> "$GITHUB_OUTPUT"
      - name: Verify hardened Electron fuses
        run: npm run verify:fuses -- --platform linux
      - name: Verify packaged application layout
        run: npm run verify:packaged -- --platform linux --dir '${{ steps.unpacked.outputs.path }}'
      - name: Verify packaged computer runtime
        run: xvfb-run --auto-servernum node scripts/verify-packaged-computer-runtime.mjs --platform linux --dir '${{ steps.unpacked.outputs.path }}'
      - name: Verify packaged bearer-authenticated MCP flow
        run: npm run test:connector-acceptance -- --dir '${{ steps.unpacked.outputs.path }}'
      - name: Smoke-test Linux desktop startup and shutdown under Xvfb
        shell: bash
        run: bash scripts/smoke-linux-desktop.sh '${{ steps.unpacked.outputs.path }}' "$RUNNER_TEMP/relai-linux-release-smoke"
      - name: Check Electron package size
        run: npm run electron:size:linux
      - name: Upload Linux release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-${{ needs.preflight.outputs.version }}
          path: ${{ steps.release-artifacts.outputs.paths }}
          if-no-files-found: error
          retention-days: 7

  mac:
    name: Build macOS release (${{ matrix.arch }})
    needs:
      - preflight
      - release-gate
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            computer_runtime_args: ''
          - arch: arm64
            runner: macos-15
            computer_runtime_args: --allow-headless
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - name: Use declared npm
        run: node scripts/ensure-package-manager.mjs
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Electron dependencies
        run: npm ci --no-audit --no-fund
        working-directory: electron
      - name: Run Electron platform regression tests
        run: |
          node test/electron-platform-unit.mjs
          node test/current-unpacked-unit.mjs
          node test/app-updater-unit.mjs
          node test/macos-manual-updater-unit.mjs
          node test/installer-test-entrypoints-unit.mjs
      - name: Build macOS release
        env:
          REL_AI_TARGET_ARCH: ${{ matrix.arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run electron:dist:mac
      - name: Resolve current unpacked application
        id: unpacked
        env:
          REL_AI_TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          package_directory="$(node scripts/current-unpacked.mjs --platform darwin)"
          test -n "$package_directory"
          test -d "$package_directory"
          echo "path=$package_directory" >> "$GITHUB_OUTPUT"
      - name: Verify packaged computer runtime
        run: node scripts/verify-packaged-computer-runtime.mjs --platform darwin --dir '${{ steps.unpacked.outputs.path }}' ${{ matrix.computer_runtime_args }}
      - name: Resolve macOS release artifact path
        id: release-artifacts
        env:
          REL_AI_TARGET_ARCH: ${{ matrix.arch }}
        run: node scripts/release-artifacts.mjs --platform darwin --arch '${{ matrix.arch }}' --github-output paths
      - name: Verify final macOS DMG contents
        env:
          REL_AI_TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(printf '%s\n' '${{ steps.release-artifacts.outputs.paths }}' | sed '/^[[:space:]]*$/d' | head -n 1)"
          test -n "$dmg_path"
          node scripts/verify-macos-release.mjs --unpacked '${{ steps.unpacked.outputs.path }}' --dmg "$dmg_path"
      - name: Upload macOS release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release-${{ needs.preflight.outputs.version }}-${{ matrix.arch }}
          path: ${{ steps.release-artifacts.outputs.paths }}
          if-no-files-found: error
          retention-days: 7

  windows-install-upgrade:
    name: Validate Windows install and upgrade
    needs:
      - preflight
      - windows
    if: needs.preflight.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install release validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download Windows release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-${{ needs.preflight.outputs.version }}
          path: dist
      - name: Validate fresh install and in-place upgrade
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REL_AI_RELEASE_INSTALL_TEST: '1'
          REL_AI_INSTALLER_TEST_ISOLATED: '1'
          REL_AI_ALLOW_PRODUCTION_INSTALLER_TEST: '1'
        run: node scripts/validate-installed-release.mjs

  linux-install-upgrade:
    name: Validate Linux install and upgrade
    needs:
      - preflight
      - linux
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install release validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Download Linux release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release-${{ needs.preflight.outputs.version }}
          path: dist
      - name: Validate fresh install and in-place upgrade
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REL_AI_RELEASE_INSTALL_TEST: '1'
        run: node scripts/validate-installed-release.mjs

  publish:
    name: Publish combined release
    needs:
      - preflight
      - windows
      - linux
      - mac
      - windows-install-upgrade
      - linux-install-upgrade
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use declared npm
        run: node scripts/ensure-package-manager.mjs
      - name: Install release tooling dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download Windows release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-${{ needs.preflight.outputs.version }}
          path: dist
      - name: Download Linux release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release-${{ needs.preflight.outputs.version }}
          path: dist
      - name: Download macOS release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-release-${{ needs.preflight.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Prepare release assets
        run: npm run prepare:release-assets
      - name: Prepare release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = process.env.VERSION;
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const pattern = new RegExp(`(?:^|\\n)##\\s+\\[${escaped}\\]\\s+(?:—|-)\\s+\\d{4}-\\d{2}-\\d{2}\\s*\\r?\\n([\\s\\S]*?)(?=\\r?\\n##\\s+\\[|$)`);
          const match = changelog.match(pattern);
          if (match?.[1]?.trim()) fs.writeFileSync('release-notes.md', `${match[1].trim()}\n`);
          NODE
          mac_notice='> **macOS:** These builds are ad-hoc signed for bundle integrity, but are not Apple Developer ID signed or notarized. Gatekeeper approval is expected. After copying Rel.AI MCP to Applications and attempting to open it once, use System Settings → Privacy & Security → Open Anyway if macOS blocks it.'
          if [ -s release-notes.md ]; then
            printf '\n%s\n' "$mac_notice" >> release-notes.md
          else
            printf '%s\n' "$mac_notice" > release-notes.md
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/latest.yml
            dist/latest-linux.yml
            dist/SHA256SUMS.txt
      - name: Attest release SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
          sbom-path: dist/sbom.cdx.json
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          RECOVER_DRAFT: ${{ needs.preflight.outputs.recover_draft }}
          CHANGELOG_NOTES_FOUND: ${{ steps.notes.outputs.found }}
        run: |
          set -euo pipefail
          mapfile -t asset_names < <(sed '/^[[:space:]]*$/d' dist/release-assets.txt)
          if [ "${#asset_names[@]}" -eq 0 ]; then
            echo 'No release assets were prepared.' >&2
            exit 1
          fi
          assets=()
          for name in "${asset_names[@]}"; do
            test -f "dist/$name"
            assets+=("dist/$name")
          done
          if [ "$RECOVER_DRAFT" = 'true' ]; then
            gh release upload "$VERSION" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            arguments=(release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Rel.AI MCP $VERSION" --draft=false)
          else
            arguments=(release create "$VERSION" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Rel.AI MCP $VERSION")
          fi
          if [ "$CHANGELOG_NOTES_FOUND" = 'true' ]; then
            arguments+=(--notes-file release-notes.md)
          else
            arguments+=(--generate-notes)
          fi
          gh "${arguments[@]}"
