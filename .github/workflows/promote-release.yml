name: Promote release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version to promote (for example 1.1.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: promote-relai-release
  cancel-in-progress: false

jobs:
  promote:
    name: Promote tested candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out promotion policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify and promote candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: node scripts/promote-release.mjs "$VERSION"
