<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>Starting Rel.AI MCP</title>
<link rel="stylesheet" href="splash.css">
<script src="splash.js" defer></script>
</head>
<body>
<main class="splash">
  <div class="ambient" aria-hidden="true"></div>
  <div class="identity">
    <div class="logo-field"><img src="relai-logo.png" width="94" height="91" alt="" aria-hidden="true"></div>
    <h1>Rel.AI <span>MCP</span></h1>
  </div>
  <div class="startup">
    <div class="progress" aria-hidden="true"><div class="progress-light"></div></div>
    <p id="startupStatus" role="status" aria-live="polite" aria-atomic="true">Starting Rel.AI…</p>
    <button id="startupSettings" type="button" hidden>Connection settings</button>
  </div>
</main>
</body>
</html>
